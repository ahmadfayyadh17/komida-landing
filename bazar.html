<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bazar KOMIDA — Koperasi MIDA Kuala Lumpur Berhad</title>
<meta name="description" content="Bazar KOMIDA — aktiviti koperasi yang menjana pendapatan untuk dipulangkan kembali kepada anggota Koperasi MIDA Kuala Lumpur Berhad.">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='10' fill='%231e3a8a'/><path d='M20 18 L20 46 M20 32 L36 18 M20 32 L36 46' stroke='white' stroke-width='6' fill='none' stroke-linecap='square'/><path d='M44 22 L52 32 L44 42 Z' fill='%23dc2626'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800;900&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#eef1f7; --bg-alt:#e2e8f3; --paper:#ffffff; --ink:#13203a; --ink2:#34405a;
    --primary:#1e3a8a; --primary-soft:#dbeafe; --accent:#3b82f6; --signal:#dc2626;
    --line:#cdd5e4; --muted:#5f6b82;
    --disp:'Archivo',system-ui,sans-serif; --body:'IBM Plex Sans',system-ui,sans-serif; --mono:'IBM Plex Mono',ui-monospace,monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{font-family:var(--body);color:var(--ink);background:var(--bg);line-height:1.65;font-size:16px;min-height:100vh}
  img{max-width:100%;display:block}
  a{color:inherit}
  .wrap{max-width:1100px;margin:0 auto;padding:0 28px}
  h1,h2,h3{font-family:var(--disp);line-height:1.06;letter-spacing:-.02em}
  .chev{display:inline-block;width:.62em;height:.78em;background:var(--signal);clip-path:polygon(0 0,55% 0,100% 50%,55% 100%,0 100%,45% 50%);transform:translateY(.06em)}
  .kicker{font-family:var(--mono);font-size:.8rem;letter-spacing:.08em;color:var(--ink2);margin-bottom:18px;display:flex;align-items:center;gap:10px}
  .kicker::before{content:"("; color:var(--muted)}
  .kicker::after{content:")"; color:var(--muted)}
  .reveal{opacity:0;transform:translateY(24px);transition:opacity .6s ease,transform .6s cubic-bezier(.2,.6,.2,1)}
  .reveal.in{opacity:1;transform:none}
  @media(prefers-reduced-motion:reduce){.reveal{opacity:1;transform:none;transition:none}}

  /* =========================================================
     NAV — expandable tabs (icon-only pill -> icon+label on select)
     Subpage variant: sticky (not fixed), always on-light, no scroll-spy
  ========================================================= */
  nav.top{position:sticky;top:0;left:0;right:0;z-index:100;background:transparent;border-bottom:1px solid transparent;transition:background .3s ease,border-color .3s ease,backdrop-filter .3s ease}
  nav.top.on-light{background:rgba(238,241,247,.4);backdrop-filter:blur(16px) saturate(160%);-webkit-backdrop-filter:blur(16px) saturate(160%);border-bottom:1px solid rgba(205,213,228,.5)}
  nav.top.on-dark{background:rgba(11,18,32,.35);backdrop-filter:blur(16px) saturate(160%);-webkit-backdrop-filter:blur(16px) saturate(160%);border-bottom:1px solid rgba(255,255,255,.08)}
  .nav-in{display:flex;align-items:center;justify-content:space-between;height:80px;gap:24px}
  .brand{display:flex;align-items:center;text-decoration:none}
  .logo-img{display:block;height:34px;width:auto;transition:filter .3s ease}
  nav.top.on-dark .logo-img{filter:brightness(0) invert(1)}

  .etabs{display:flex;align-items:center;gap:4px;background:rgba(255,255,255,.35);border:1px solid rgba(255,255,255,.5);border-radius:999px;padding:6px;backdrop-filter:blur(6px);transition:background .3s ease,border-color .3s ease}
  .etab{display:flex;align-items:center;gap:7px;border:0;background:none;cursor:pointer;font-family:var(--disp);font-weight:700;font-size:.86rem;color:var(--ink2);
    padding:10px 14px;border-radius:999px;white-space:nowrap;overflow:hidden;transition:background .25s cubic-bezier(.2,.7,.2,1),color .2s ease,padding .25s cubic-bezier(.2,.7,.2,1)}
  .etab svg{width:18px;height:18px;flex:0 0 auto}
  .etab .etab-label{max-width:0;opacity:0;overflow:hidden;transition:max-width .3s cubic-bezier(.2,.7,.2,1),opacity .2s ease;display:inline-block}
  .etab:hover{color:var(--ink);background:rgba(19,32,58,.08)}
  .etab.active{background:var(--ink);color:#fff}
  .etab.active .etab-label{max-width:140px;opacity:1;margin-left:1px}
  .etab-sep{width:1px;height:22px;background:var(--line);margin:0 4px;flex:0 0 auto}

  /* etab with dropdown (Aktiviti: Bazar / Projek) */
  .etab-dd{position:relative}
  .etab-dd-menu{position:absolute;top:calc(100% + 10px);left:50%;transform:translateX(-50%) translateY(-6px);min-width:200px;
    background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 18px 40px rgba(16,20,24,.16);padding:8px;
    opacity:0;pointer-events:none;transition:opacity .2s ease,transform .2s ease;z-index:50}
  .etab-dd:hover .etab-dd-menu,.etab-dd:focus-within .etab-dd-menu{opacity:1;pointer-events:auto;transform:translateX(-50%) translateY(0)}
  .etab-dd-item{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;padding:11px 14px;border-radius:10px;border:0;background:none;
    font-family:var(--disp);font-weight:700;font-size:.86rem;color:var(--ink2);text-align:left;cursor:pointer;white-space:nowrap}
  .etab-dd-item:hover{background:rgba(19,32,58,.08);color:var(--ink)}
  .etab-dd-item[disabled]{color:var(--muted);cursor:default;opacity:.6}
  .etab-dd-item[disabled]:hover{background:none}
  .etab-dd-item .soon{font-family:var(--mono);font-size:.62rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--bg-alt);padding:3px 8px;border-radius:999px}
  nav.top.on-dark .etabs{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.18)}
  nav.top.on-dark .etab{color:rgba(255,255,255,.78)}
  nav.top.on-dark .etab:hover{color:#fff;background:rgba(255,255,255,.12)}
  nav.top.on-dark .etab.active{background:#fff;color:var(--ink)}
  nav.top.on-dark .etab-sep{background:rgba(255,255,255,.25)}
  nav.top.on-dark .nav-toggle span{background:#fff}

  .nav-cta{display:inline-flex;align-items:center;gap:8px;background:#25D366;color:#fff;text-decoration:none;font-family:var(--disp);font-size:.86rem;font-weight:700;padding:11px 20px;border-radius:999px;transition:background .15s ease}
  .nav-cta:hover{background:#1ebe5d}
  .nav-cta svg{width:16px;height:16px;flex:0 0 auto}
  .nav-toggle{display:none;background:none;border:0;cursor:pointer;padding:8px;margin-right:-8px}
  .nav-toggle span{display:block;width:24px;height:2.5px;background:var(--ink);border-radius:2px;margin:5px 0;transition:transform .25s ease,opacity .2s ease}
  .nav-toggle[aria-expanded="true"] span:nth-child(1){transform:translateY(7.5px) rotate(45deg)}
  .nav-toggle[aria-expanded="true"] span:nth-child(2){opacity:0}
  .nav-toggle[aria-expanded="true"] span:nth-child(3){transform:translateY(-7.5px) rotate(-45deg)}
  .nav-backdrop{position:fixed;inset:0;background:rgba(16,20,24,.55);opacity:0;pointer-events:none;transition:opacity .25s ease;z-index:160}
  .nav-backdrop.open{opacity:1;pointer-events:auto}
  .nav-drawer{position:fixed;top:0;right:0;bottom:0;width:min(82vw,340px);background:var(--bg);z-index:170;
    transform:translateX(100%);transition:transform .3s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column;box-shadow:-12px 0 40px rgba(16,20,24,.14)}
  .nav-drawer.open{transform:translateX(0)}
  .nav-drawer-head{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--line)}
  .nav-drawer-head img{height:36px;width:auto}
  .nav-drawer-close{background:none;border:0;cursor:pointer;padding:8px;color:var(--ink);font-size:24px;line-height:1;border-radius:8px}
  .nav-drawer-close:hover{background:#dde4f1}
  .nav-drawer-links{display:flex;flex-direction:column;padding:14px 0;flex:1}
  .nav-drawer-links a{padding:14px 24px;font-family:var(--disp);font-weight:700;font-size:1.05rem;color:var(--ink);text-decoration:none;border-left:3px solid transparent;transition:background .15s ease,border-color .15s ease,color .15s ease}
  .nav-drawer-links a:hover{background:#dde4f1;border-left-color:var(--signal);color:var(--primary)}
  .nav-drawer-group{padding:16px 24px 4px;font-family:var(--mono);font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
  .nav-drawer-links a.nav-drawer-sub{padding-left:38px;font-size:.98rem;font-weight:600}
  .nav-drawer-cta{padding:18px 22px;border-top:1px solid var(--line)}
  .nav-drawer-cta a{display:flex;align-items:center;justify-content:center;gap:10px;background:#25D366;color:#fff;text-decoration:none;font-weight:700;padding:14px 18px;border-radius:999px;font-size:.94rem}
  .nav-drawer-cta a:hover{background:#1ebe5d}
  .nav-drawer-cta svg{width:18px;height:18px}
  @media(max-width:880px){.etabs{display:none}.nav-cta{display:none}.nav-toggle{display:block}}
  @media(min-width:881px){.nav-drawer,.nav-backdrop{display:none}}

  .page-head{padding:72px 0 56px;border-bottom:1px solid var(--ink)}
  .back{display:inline-flex;align-items:center;gap:8px;color:var(--muted);text-decoration:none;font-family:var(--mono);font-size:.8rem;margin-bottom:24px}
  .back:hover{color:var(--ink)}
  .page-head h1{font-size:clamp(3rem,9vw,6.5rem);font-weight:900;letter-spacing:-.03em;text-transform:uppercase;line-height:.95}
  .page-head h1 .outline{color:transparent;-webkit-text-stroke:2px var(--ink)}
  .page-head p{max-width:60ch;margin-top:22px;color:var(--ink2);font-size:1.04rem}

  main{padding:56px 0 100px}
  .photo-frame{background:var(--paper);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:48px}
  .photo-frame img{width:100%;height:auto;display:block}
  .photo-frame .ph{aspect-ratio:16/9;background:repeating-linear-gradient(45deg,#dde4f1 0,#dde4f1 18px,#e7ecf5 18px,#e7ecf5 36px);display:flex;align-items:center;justify-content:center;color:var(--muted);font-family:var(--mono);font-size:.86rem;letter-spacing:.08em;text-transform:uppercase}
  .photo-frame .ph span{background:var(--paper);padding:10px 18px;border-radius:999px;border:1px solid var(--line)}
  .photo-frame .caption{padding:14px 18px;font-family:var(--mono);font-size:.76rem;color:var(--muted);border-top:1px solid var(--line);text-align:center}

  .article-body{max-width:74ch;margin:0 auto;font-size:1.04rem;line-height:1.78;color:var(--ink2)}
  .article-body p{margin-bottom:22px}
  .article-body p strong{color:var(--ink)}
  .article-body h2{font-size:clamp(1.4rem,3vw,1.8rem);font-weight:800;color:var(--ink);margin:42px 0 18px}
  .article-body ul{margin:0 0 26px 0;padding:0;list-style:none}
  .article-body ul li{position:relative;padding-left:28px;margin-bottom:14px}
  .article-body ul li::before{content:"";position:absolute;left:0;top:.55em;width:14px;height:2px;background:var(--signal)}
  .article-body ul li strong{color:var(--ink);font-weight:700}
  .placeholder-block{padding:40px;background:var(--paper);border:1px dashed var(--line);border-radius:14px;text-align:center;color:var(--muted);font-family:var(--mono);font-size:.92rem}

  .actions{display:flex;gap:14px;flex-wrap:wrap;margin-top:48px;padding-top:36px;border-top:1px solid var(--line);justify-content:center}
  .btn{display:inline-block;text-decoration:none;font-family:var(--mono);font-size:.82rem;font-weight:600;padding:13px 26px;border-radius:999px;transition:background .15s ease,color .15s ease,transform .15s ease;letter-spacing:.04em}
  .btn:hover{transform:translateY(-2px)}
  .btn-dark{background:var(--ink);color:#fff}
  .btn-dark:hover{background:var(--primary)}
  .btn-ghost{background:none;color:var(--ink);border:1.5px solid var(--ink)}
  .btn-ghost:hover{background:var(--ink);color:#fff}

  footer{background:var(--ink);color:#aab3bd;padding:48px 0;text-align:center;font-family:var(--mono);font-size:.78rem}
  footer a{color:#93c5fd;text-decoration:none}
  footer a:hover{color:#fff}
  :focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:4px}
</style>
</head>
<body>

<nav class="top on-light">
  <div class="wrap nav-in">
    <a class="brand" href="index.html" aria-label="KOMIDA - Koperasi MIDA Kuala Lumpur Berhad">
      <img class="logo-img" src="komida-logo-3.png" alt="KOMIDA — Koperasi MIDA Kuala Lumpur Berhad">
    </a>
    <div class="etabs" role="tablist" aria-label="Navigasi utama">
      <button class="etab" data-href="index.html#top" role="tab" aria-selected="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v9h14v-9"/></svg>
        <span class="etab-label">Utama</span>
      </button>
      <button class="etab" data-href="index.html#tentang" role="tab" aria-selected="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg>
        <span class="etab-label">Mengenai Kami</span>
      </button>
      <button class="etab" data-href="pinjaman.html" role="tab" aria-selected="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M7 14h4"/></svg>
        <span class="etab-label">Pinjaman</span>
      </button>
      <button class="etab" data-href="takaful.html" role="tab" aria-selected="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 4 6v6c0 5 3.5 7.5 8 9 4.5-1.5 8-4 8-9V6l-8-3Z"/></svg>
        <span class="etab-label">Takaful</span>
      </button>
      <button class="etab" data-href="sjc.html" role="tab" aria-selected="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M3 7l9-4 9 4M8 12v4M12 12v4M16 12v4"/></svg>
        <span class="etab-label">SJC</span>
      </button>
      <div class="etab-dd">
        <button class="etab active" data-href="bazar.html" role="tab" aria-selected="true" aria-haspopup="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9h18l-1.5 10.5a2 2 0 0 1-2 1.5H6.5a2 2 0 0 1-2-1.5L3 9Z"/><path d="M8 9V6a4 4 0 0 1 8 0v3"/></svg>
          <span class="etab-label">Aktiviti</span>
        </button>
        <div class="etab-dd-menu" role="menu" aria-label="Aktiviti">
          <button class="etab-dd-item" type="button" data-href="bazar.html" role="menuitem">Bazar</button>
          <button class="etab-dd-item" type="button" disabled aria-disabled="true">Projek <span class="soon">Akan Datang</span></button>
        </div>
      </div>
      <button class="etab" data-href="index.html#manfaat" role="tab" aria-selected="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-4.5-9.5-9A5.5 5.5 0 0 1 12 6a5.5 5.5 0 0 1 9.5 6c-2.5 4.5-9.5 9-9.5 9Z"/></svg>
        <span class="etab-label">Manfaat</span>
      </button>
      <button class="etab" data-href="borang.html" role="tab" aria-selected="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5M9 13h6M9 17h6"/></svg>
        <span class="etab-label">Borang</span>
      </button>
      <span class="etab-sep" aria-hidden="true"></span>
      <button class="etab" data-href="index.html#faq" role="tab" aria-selected="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.2a2.5 2.5 0 1 1 3.6 2.4c-.9.5-1.1.9-1.1 1.9M12 17h.01"/><
