<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Halaman Tidak Dijumpai — KOMIDA</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='10' fill='%231e3a8a'/><path d='M20 18 L20 46 M20 32 L36 18 M20 32 L36 46' stroke='white' stroke-width='6' fill='none' stroke-linecap='square'/><path d='M44 22 L52 32 L44 42 Z' fill='%23dc2626'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800;900&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{--bg:#eef1f7;--paper:#ffffff;--ink:#13203a;--ink2:#34405a;--primary:#1e3a8a;--signal:#dc2626;--line:#cdd5e4;--muted:#5f6b82;
    --disp:'Archivo',system-ui,sans-serif;--body:'IBM Plex Sans',system-ui,sans-serif;--mono:'IBM Plex Mono',ui-monospace,monospace}
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:var(--body);color:var(--ink);background:var(--bg);line-height:1.65;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px 16px}
  main{max-width:560px;text-align:center}
  img{height:34px;width:auto;margin:0 auto 40px;display:block}
  .code{font-family:var(--mono);font-size:.85rem;letter-spacing:.1em;color:var(--signal);margin-bottom:12px}
  h1{font-family:var(--disp);font-weight:800;font-size:clamp(1.8rem,5vw,2.6rem);line-height:1.1;letter-spacing:-.02em;margin-bottom:16px}
  p{color:var(--ink2);margin-bottom:32px}
  .actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
  .btn{display:inline-flex;align-items:center;text-decoration:none;font-weight:700;font-size:.95rem;padding:14px 26px;border-radius:999px}
  .btn-dark{background:var(--ink);color:#fff}
  .btn-dark:hover{background:var(--primary)}
  .btn-ghost{border:1.5px solid var(--ink);color:var(--ink)}
  .btn-ghost:hover{border-color:var(--primary);color:var(--primary)}
  :focus-visible{outline:3px solid #3b82f6;outline-offset:2px}
</style>
</head>
<body>
<main>
  <!-- absolute paths: this page is served for missing URLs at any depth -->
  <img src="/komida-logo-3.png" width="600" height="145" alt="KOMIDA — Koperasi MIDA Kuala Lumpur Berhad">
  <div class="code">( 404 )</div>
  <h1>Halaman tidak dijumpai.</h1>
  <p>Pautan ini mungkin telah dipindahkan atau tidak lagi wujud. Cuba ke laman utama atau muat turun borang yang anda perlukan.</p>
  <div class="actions">
    <a class="btn btn-dark" href="/">Laman Utama</a>
    <a class="btn btn-ghost" href="/borang.html">Borang</a>
  </div>
</main>
</body>
</html>
